<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">

<!--
  Fontconfig for server-side image rendering (per-camp OG cards).

  WHY THIS FILE EXISTS
  ====================
  sharp renders text through libvips -> pango -> fontconfig, and fontconfig
  answers from the HOST's font set. Azure App Service Linux ships neither
  Inter nor Noto Sans Devanagari, so a Marathi camp name ("अमरावती रक्तदान
  शिबिर") renders as tofu boxes - or as nothing at all - while the same code
  on a Windows dev box looks perfect, because Windows silently falls back to
  Nirmala UI. That divergence is the entire reason the fonts are committed
  here and the entire reason this config exists.

  DELIBERATELY NO <include> OF THE SYSTEM CONFIG
  ==============================================
  This config is the WHOLE font world for the render path: the only <dir> is
  this directory. That is not tidiness, it is the test strategy. Because no
  system fallback is reachable, a local render that shapes Devanagari proves
  the shipped .ttf files did it, which is the one thing a Windows box can
  otherwise never tell you. If you add an <include>, local runs start passing
  for a reason prod does not have, and the trap is back.

  <dir prefix="relative">.</dir> resolves against THIS file's directory, so
  the same config works from any cwd, on Windows and on Linux, with no
  absolute path to keep in sync.

  HOW IT IS ACTIVATED
  ===================
  FONTCONFIG_PATH must point at this DIRECTORY (not at this file).
  backend/src/services/images/fonts.js sets it in-process before the first
  text render, so there is no App Service appsetting to forget on deploy and
  dev is identical to prod. Do not switch that to an `az` setting.

  ADDING A WEIGHT
  ==============
  Drop the .ttf in beside the others and reference it by its real family +
  weight in pango markup (font_desc="Inter SemiBold 40"). Nothing here needs
  editing - the <dir> scan picks it up.
-->
<fontconfig>
  <!-- The only font source. Relative to this file's directory. -->
  <dir prefix="relative">.</dir>

  <!--
    Cache. Best-effort: if neither location is writable, fontconfig warns once
    and re-scans on each process start. With 7 font files that scan is a few
    milliseconds, so an unwritable cache is a non-event - never let a missing
    cache dir become a render failure.
  -->
  <cachedir prefix="relative">.fontcache</cachedir>
  <cachedir>/tmp/raktify-fontcache</cachedir>

  <!--
    Latin -> Inter, Devanagari -> Noto Sans Devanagari, in that order, for
    every generic family. A mixed Marathi/Latin camp name ("Amravati रक्तदान
    2026") is one text run, so pango needs both reachable from one request;
    it picks per-glyph coverage from this list.
  -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Sans Devanagari</family>
    </prefer>
  </alias>
  <alias>
    <family>sans</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Sans Devanagari</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Sans Devanagari</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Sans Devanagari</family>
    </prefer>
  </alias>

  <!--
    Inter carries no Devanagari, so an "Inter" request for a Marathi string
    must be able to reach Noto. This is what makes font_desc="Inter Bold 44"
    correct for BOTH scripts and keeps the renderer from having to guess the
    script before choosing a family.
  -->
  <alias>
    <family>Inter</family>
    <accept>
      <family>Noto Sans Devanagari</family>
    </accept>
  </alias>

  <!-- The design system is one family; keep hinting/antialiasing uniform. -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>
